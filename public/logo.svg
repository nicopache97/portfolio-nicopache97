<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="NicoPache97 Logo">
  <defs>
    <!-- Primary gradient: cyan to emerald -->
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(189,94%,43%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle inner glow for the hexagon -->
    <filter id="hex-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip path for the hex shape -->
    <clipPath id="hex-clip">
      <polygon points="60,4 108,30 108,82 60,108 12,82 12,30" />
    </clipPath>
  </defs>

  <!-- ── Background hexagon (dark) ── -->
  <polygon
    points="60,4 108,30 108,82 60,108 12,82 12,30"
    fill="hsl(220,20%,10%)"
    stroke="url(#grad-primary)"
    stroke-width="2"
  />

  <!-- ── Circuit-trace decorations (top-left) ── -->
  <g opacity="0.25" stroke="url(#grad-primary)" stroke-width="1" fill="none">
    <line x1="18" y1="36" x2="30" y2="36" />
    <line x1="30" y1="36" x2="30" y2="48" />
    <circle cx="30" cy="48" r="1.8" fill="url(#grad-primary)" stroke="none" />

    <line x1="20" y1="52" x2="28" y2="52" />
    <circle cx="28" cy="52" r="1.5" fill="url(#grad-primary)" stroke="none" />
  </g>

  <!-- ── Circuit-trace decorations (bottom-right) ── -->
  <g opacity="0.25" stroke="url(#grad-primary)" stroke-width="1" fill="none">
    <line x1="102" y1="76" x2="90" y2="76" />
    <line x1="90" y1="76" x2="90" y2="64" />
    <circle cx="90" cy="64" r="1.8" fill="url(#grad-primary)" stroke="none" />

    <line x1="100" y1="60" x2="92" y2="60" />
    <circle cx="92" cy="60" r="1.5" fill="url(#grad-primary)" stroke="none" />
  </g>

  <!-- ── Letters "NP" ── -->
  <g filter="url(#glow)">
    <!-- N -->
    <text
      x="21"
      y="78"
      font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-size="48"
      font-weight="700"
      fill="url(#grad-primary)"
      letter-spacing="-2"
    >NP</text>
  </g>

  <!-- ── Accent dot (AI node) ── -->
  <circle cx="94" cy="30" r="4" fill="url(#grad-primary)" opacity="0.9" filter="url(#glow)" />
  <circle cx="94" cy="30" r="2" fill="white" opacity="0.6" />

  <!-- ── Bottom accent line ── -->
  <line
    x1="32" y1="95"
    x2="88" y2="95"
    stroke="url(#grad-primary)"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.5"
  />
</svg>
